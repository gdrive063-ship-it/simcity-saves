name: Keep Nhost awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the saves backend
        run: |
          curl -s -X POST https://riexiuwkfkxlgxuurqeq.hasura.ap-south-1.nhost.run/v1/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"query { saves(limit: 1) { id } }"}'
