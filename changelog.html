<!-- changelog.html - Version history for the SimCity Saves website -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Changelog · SimCity Saves</title>
    <meta name="description" content="Version history and updates for the SimCity Saves website." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <script>
      (function(){try{var t=localStorage.getItem('simcity-saves-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-nav="changelog">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header id="site-header"></header>

    <main id="main-content">
      <div class="container">
        <section class="page-hero" aria-labelledby="changelog-heading">
          <h1 id="changelog-heading">Changelog</h1>
          <p class="page-lead">Changes to the SimCity Saves website. Newest first.</p>
        </section>

        <section aria-label="Version history">
          <div id="changelog-list"></div>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module">
      import { renderChangelog } from './changelog.js';
      import { initNav } from './nav.js';

      initNav('changelog');
      renderChangelog();
    </script>
  </body>
</html>
