<!-- index.html - Home page for SimCity Saves -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimCity Saves</title>
    <meta name="description" content="Browse, download, and share saved cities from the Vij city simulator." />
    <meta property="og:title" content="SimCity Saves" />
    <meta property="og:description" content="Browse, download, and share saved cities from the Vij city simulator." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <script>
      (function(){try{var t=localStorage.getItem('simcity-saves-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-nav="home">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header id="site-header"></header>

    <main id="main-content">
      <div class="container">
        <section class="page-hero" aria-labelledby="home-heading">
          <h1 id="home-heading">Saved cities from Vij</h1>
          <p class="page-lead">
            Explore community-built cities, inspect their survival stats, and download saves to continue in Vij.
          </p>
          <div class="toolbar">
            <div class="search-wrap">
              <label class="sr-only" for="home-search">Search saves</label>
              <input
                id="home-search"
                class="input input-pill"
                type="search"
                placeholder="Search cities by title or description..."
                autocomplete="off"
              />
            </div>
            <a class="btn btn-primary" href="upload.html">Upload a save</a>
          </div>
        </section>

        <section class="section-block" aria-labelledby="latest-heading">
          <div class="section-header">
            <h2 id="latest-heading">Latest saves</h2>
            <a class="section-link" href="browse.html?sort=newest">Browse all</a>
          </div>
          <div id="latest-saves"></div>
        </section>

        <section class="section-block" aria-labelledby="popular-heading">
          <div class="section-header">
            <h2 id="popular-heading">Most downloaded</h2>
            <a class="section-link" href="browse.html?sort=most-downloaded">View leaderboard</a>
          </div>
          <div id="popular-saves"></div>
        </section>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module">
      import { initNav } from './nav.js';
      import { renderSaveGrid } from './render.js';
      import { getSaves } from './saves-data.js';
      import { filterAndSortSaves } from './sort-search.js';

      initNav('home');

      const searchInput = document.getElementById('home-search');
      const latestContainer = document.getElementById('latest-saves');
      const popularContainer = document.getElementById('popular-saves');
      const allSaves = getSaves();

      function updateHomeSections() {
        const query = searchInput.value;
        const emptyText = allSaves.length === 0
          ? 'No saves yet. Be the first to upload one.'
          : 'No saves match your search.';
        const emptyAction = allSaves.length === 0 ? { href: 'upload.html', label: 'Upload a save' } : null;

        const latest = filterAndSortSaves(allSaves, { query, sortBy: 'newest' }).slice(0, 4);
        const popular = filterAndSortSaves(allSaves, { query, sortBy: 'most-downloaded' }).slice(0, 4);

        renderSaveGrid(latestContainer, latest, emptyText, emptyAction);
        renderSaveGrid(popularContainer, popular, emptyText, emptyAction);
      }

      searchInput.addEventListener('input', updateHomeSections);
      updateHomeSections();
    </script>
  </body>
</html>
