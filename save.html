<!-- save.html - Single city save details, stats panel, and download -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save Details · SimCity Saves</title>
    <meta name="description" content="Inspect city statistics and download a Vij save file." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <script>
      (function(){try{var t=localStorage.getItem('simcity-saves-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-nav="browse">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header id="site-header"></header>

    <main id="main-content">
      <div class="container">
        <div id="save-container"></div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module">
      import { getDownloadUrl } from './download-url.js';
      import { formatDate, formatDownloads } from './format.js';
      import { initNav } from './nav.js';
      import { renderEmptyState, renderLoadingState, renderStatsPanel } from './render.js';
      import { getSaveById, getSaves, incrementDownloads } from './saves-data.js';

      initNav('browse');

      const container = document.getElementById('save-container');
      const saveId = new URLSearchParams(window.location.search).get('id');

      function formatMetaLine(save, downloadsCount) {
        const version = save.game_version || save.gameVersion || 'Unknown';
        const dateText = formatDate(save.created_at || save.uploadedAt);
        return `Version ${version} · Uploaded ${dateText} · ${formatDownloads(downloadsCount)}`;
      }

      async function loadSaveDetail() {
        renderLoadingState(container, 'Loading save details...');
        try {
          const save = saveId ? await getSaveById(saveId) : null;
          if (!save) {
            const allSaves = await getSaves();
            const message = allSaves.length === 0
              ? 'No saves yet. Be the first to upload one.'
              : 'That save could not be found. It may have been removed.';
            const action = allSaves.length === 0
              ? { href: 'upload.html', label: 'Upload a save' }
              : { href: 'browse.html', label: 'Back to Browse' };
            renderEmptyState(container, message, action);
            return;
          }

          document.title = `${save.title} · SimCity Saves`;
          container.textContent = '';
          container.removeAttribute('aria-busy');

          const card = document.createElement('article');
          card.className = 'surface-card';

          const header = document.createElement('div');
          header.className = 'detail-header';

          const info = document.createElement('div');
          const heading = document.createElement('h1');
          heading.textContent = save.title || 'Untitled city';
          const meta = document.createElement('div');
          meta.className = 'detail-meta';
          meta.textContent = formatMetaLine(save, save.downloads);
          info.append(heading, meta);

          if (save.description && String(save.description).trim()) {
            const desc = document.createElement('p');
            desc.className = 'detail-description';
            desc.textContent = save.description;
            info.appendChild(desc);
          }

          const fileUrl = getDownloadUrl(save.file_id);
          const slug = String(save.title || 'vij-city')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '') || 'vij-city';

          const downloadLink = document.createElement('a');
          downloadLink.className = 'btn btn-primary';
          downloadLink.textContent = 'Download save (.json)';
          if (fileUrl) {
            downloadLink.href = fileUrl;
            downloadLink.setAttribute('download', `${slug}.json`);
            downloadLink.rel = 'noopener';
            downloadLink.addEventListener('click', () => {
              incrementDownloads(save.id)
                .then((updated) => {
                  if (updated && typeof updated.downloads === 'number') {
                    meta.textContent = formatMetaLine(save, updated.downloads);
                  }
                })
                .catch(() => {
                  // A failed increment must not block or disrupt the download
                });
            });
          } else {
            downloadLink.href = '#';
            downloadLink.setAttribute('aria-disabled', 'true');
          }

          header.append(info, downloadLink);

          const statsHost = document.createElement('section');
          statsHost.setAttribute('aria-label', 'City statistics');
          renderStatsPanel(statsHost, save);

          card.append(header, statsHost);
          container.appendChild(card);
        } catch (err) {
          const msg = err?.message || 'Could not reach the save server. Check your connection and try again.';
          renderEmptyState(container, msg, { href: 'browse.html', label: 'Back to Browse' });
        }
      }

      loadSaveDetail();
    </script>
  </body>
</html>
